name: Test, Build & Deploy

# Gitflow, same shape as swarmpit:
#   develop / PRs -> test; develop also publishes a prerelease plugin tagged
#                    with the GitVersion semVer (e.g. 0.2.0-alpha.7) and a
#                    moving :develop tag for staging installs
#   main          -> tested only; releases come from release.yml off a tag

on:
  push:
    branches: ['main', 'develop']
  pull_request:
    branches: ['develop']
  workflow_dispatch:

jobs:
  go:
    name: Test Go
    runs-on: ubuntu-latest
    outputs:
      semVer: ${{ steps.gitversion.outputs.semVer }}
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: install GitVersion
        uses: gittools/actions/gitversion/setup@v4.7.0
        with:
          versionSpec: '6.x'
      - name: determine version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4.7.0
      - name: install go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -d .; exit 1; }
      - run: go vet ./...
      - run: go test ./... -race -count=1
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
      - name: build binary
        run: |
          CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X main.version=${{ steps.gitversion.outputs.semVer }}" \
            -o bin/docker-volume-flasharray ./cmd/docker-volume-flasharray
          bin/docker-volume-flasharray -version
      - name: upload binary
        uses: actions/upload-artifact@v7
        with:
          name: docker-volume-flasharray
          path: bin/docker-volume-flasharray

  plugin:
    name: Build and push plugin
    runs-on: ubuntu-latest
    needs: go
    # main is not published here; release.yml owns versions and :latest.
    if: github.ref != 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/changemakerstudios/docker-volume-flasharray
      SEMVER: ${{ needs.go.outputs.semVer }}
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: build rootfs
        # Managed plugins are their own artifact type: buildx exports the
        # rootfs, `docker plugin create` wraps it with plugin/config.json.
        run: |
          mkdir -p build/plugin/rootfs
          docker buildx build --platform linux/amd64 \
            --build-arg VERSION=${SEMVER} \
            --output type=local,dest=build/plugin/rootfs .
          cp plugin/config.json build/plugin/config.json
      - name: create plugin
        run: |
          docker plugin create ${IMAGE}:${SEMVER} build/plugin
          docker plugin create ${IMAGE}:develop build/plugin
          docker plugin ls
      - name: smoke-test rootfs
        run: |
          docker buildx build --platform linux/amd64 --load -t dvfa-smoke:ci --build-arg VERSION=${SEMVER} .
          docker run --rm dvfa-smoke:ci -version
          docker run --rm --entrypoint sh dvfa-smoke:ci -c 'iscsiadm --version && nvme version && mkfs.xfs -V'
      - name: login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: push
        if: github.event_name != 'pull_request'
        run: |
          docker plugin push ${IMAGE}:${SEMVER}
          docker plugin push ${IMAGE}:develop
