name: Test, Build & Deploy

# Gitflow, same shape as swarmpit:
#   develop / PRs -> test; develop also publishes a prerelease plugin tagged
#                    with the GitVersion semVer (e.g. 0.2.0-alpha.7) and a
#                    moving :develop tag for staging installs
#   main          -> tested only; releases come from release.yml off a tag

on:
  push:
    branches: ['main', 'develop']
  pull_request:
    branches: ['main', 'develop']
  workflow_dispatch:

jobs:
  go:
    name: Test Go
    runs-on: ubuntu-latest
    outputs:
      semVer: ${{ steps.gitversion.outputs.semVer }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: install GitVersion
        uses: gittools/actions/gitversion/setup@389fe43e6b0189b98c40c43553070ac029304635 # v5.0.0
        with:
          versionSpec: '6.x'
      - name: determine version
        id: gitversion
        uses: gittools/actions/gitversion/execute@389fe43e6b0189b98c40c43553070ac029304635 # v5.0.0
      - name: install go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -d .; exit 1; }
      - run: go vet ./...
      - run: go test ./... -race -count=1
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      - name: build binary
        run: |
          CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X main.version=${{ steps.gitversion.outputs.semVer }}" \
            -o bin/docker-volume-flasharray ./cmd/docker-volume-flasharray
          bin/docker-volume-flasharray -version
      - name: upload binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docker-volume-flasharray
          path: bin/docker-volume-flasharray

  plugin:
    name: Build and push plugin
    runs-on: ubuntu-latest
    needs: go
    # main is not published here; release.yml owns versions and :latest.
    if: github.ref != 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/changemakerstudios/docker-volume-flasharray
      SEMVER: ${{ needs.go.outputs.semVer }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: build rootfs
        # Managed plugins are their own artifact type: buildx exports the
        # rootfs, `docker plugin create` wraps it with plugin/config.json.
        run: |
          mkdir -p build/plugin/rootfs
          docker buildx build --platform linux/amd64 \
            --build-arg VERSION=${SEMVER} \
            --output type=local,dest=build/plugin/rootfs .
          cp plugin/config.json build/plugin/config.json
      - name: create plugin
        run: |
          docker plugin create ${IMAGE}:${SEMVER} build/plugin
          docker plugin ls
      - name: smoke-test rootfs
        run: |
          docker buildx build --platform linux/amd64 --load -t dvfa-smoke:ci --build-arg VERSION=${SEMVER} .
          docker run --rm dvfa-smoke:ci -version
          docker run --rm --entrypoint sh dvfa-smoke:ci -c 'nsenter --version && mkfs.xfs -V && blkid -V && blockdev --help >/dev/null'
      - name: login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: push
        if: github.event_name != 'pull_request'
        # The daemon refuses a second plugin with identical content, so push and
        # remove the first tag before creating the second.
        run: |
          docker plugin push ${IMAGE}:${SEMVER}
          docker plugin rm ${IMAGE}:${SEMVER}
          docker plugin create ${IMAGE}:develop build/plugin
          docker plugin push ${IMAGE}:develop
