name: Release

# Cut a release by tagging main: `git tag 0.1.0 && git push origin 0.1.0`
# (no `v` prefix, matching the other ChangemakerStudios repos). One build
# produces both :<tag> and :latest, then a GitHub release with the binary
# and the plugin bundle attached.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing git tag to release (e.g. 0.1.0)'
        required: true
        type: string

env:
  IMAGE: ghcr.io/changemakerstudios/docker-volume-flasharray
  VERSION: ${{ inputs.tag || github.ref_name }}

jobs:
  go:
    name: Test Go
    runs-on: ubuntu-latest
    steps:
      - name: checkout tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: install go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test ./... -race -count=1
      - name: build binary
        # The binary reports this from `-version` and in its startup log;
        # here the tag is the version.
        run: |
          CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o bin/docker-volume-flasharray ./cmd/docker-volume-flasharray
          bin/docker-volume-flasharray -version
      - name: upload binary
        uses: actions/upload-artifact@v7
        with:
          name: docker-volume-flasharray
          path: bin/docker-volume-flasharray

  plugin:
    name: Build and push plugin
    runs-on: ubuntu-latest
    needs: go
    permissions:
      contents: read
      packages: write
    steps:
      - name: checkout tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: build rootfs
        run: |
          mkdir -p build/plugin/rootfs
          docker buildx build --platform linux/amd64 \
            --build-arg VERSION=${VERSION} \
            --output type=local,dest=build/plugin/rootfs .
          cp plugin/config.json build/plugin/config.json
      - name: create plugin
        run: docker plugin create ${IMAGE}:${VERSION} build/plugin
      - name: bundle plugin for the release page
        run: tar -C build -czf docker-volume-flasharray-${VERSION}-plugin.tgz plugin
      - name: upload bundle
        uses: actions/upload-artifact@v7
        with:
          name: plugin-bundle
          path: docker-volume-flasharray-${{ inputs.tag || github.ref_name }}-plugin.tgz
      - name: login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: push
        # Both tags from the one rootfs, so :latest is the released plugin and
        # not another build of the same commit. The daemon refuses a second
        # plugin with identical content, so each tag is pushed and removed first.
        run: |
          docker plugin push ${IMAGE}:${VERSION}
          docker plugin rm ${IMAGE}:${VERSION}
          docker plugin create ${IMAGE}:latest build/plugin
          docker plugin push ${IMAGE}:latest

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: plugin
    permissions:
      contents: write
    steps:
      - name: checkout tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/download-artifact@v8
        with:
          name: docker-volume-flasharray
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: plugin-bundle
          path: dist
      - name: create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            dist/docker-volume-flasharray
            dist/docker-volume-flasharray-*-plugin.tgz
          generate_release_notes: true
