# Actions and base images are pinned by SHA and digest; this keeps the pins current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
    ignore:
      # v5 needs GitVersion 7; build.yml installs 6.x (#8).
      - dependency-name: gittools/actions/*
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule: { interval: weekly }
  - package-ecosystem: gomod
    directory: /
    target-branch: develop
    schedule: { interval: weekly }
